# Human-labelled (claim, passage) pairs to measure how well the Jev support judgment agrees with a person.
# label: supports | contradicts | unsupported
passages:
  hil: "Table 1A(1) Health investigation levels for soil contaminants. Chemical, Residential A, Residential B, Recreational C, Commercial/industrial D (mg/kg). Arsenic 100 500 300 3 000. Cadmium 20 150 90 900. Lead 300 1200 600 1 500. Mercury (inorganic) 40 120 80 730."
  hilnote: "HILs are not intended to be clean-up levels. The decision on whether clean-up is required, and to what extent, should be based on site-specific assessment triggered by an exceedence of the HIL. HILs apply generally to the top 3 m of soil for residential use."
  correction: "[email - CORRECTION - excavation volume - 2026-07-02] Ruth, a correction to my 12 June update: the 3,400 m3 figure was wrong. The surveyed volume removed is 2,860 m3. This lowers the disposal cost by approximately A$96k against what I implied."
  reversal: "[email - RE: Neutralisation - switch to crushed limestone - 2026-05-13] Agreed. Reverse the earlier decision: replace lime dosing with crushed limestone in the treatment pond. Update the ASSMP as an addendum and tell the client the discharge pH was exceeded on 4 May."
  trend: "[email - Round 2 results - trend - 2026-07-15] Round 2: MW04 PFOS + PFHxS = 9.8 ug/L (down from 12.4 ug/L in Round 1), a 21% decrease, but still well above the 0.07 ug/L screening value. Off-site surface water: all six points non-detect for PFOS and PFHxS."
  rpd: "Data for primary and duplicate is collated and reported as a relative percent difference (RPD) of the mean concentration of both samples. If results show greater than 30% difference, a review should be conducted of the cause."
